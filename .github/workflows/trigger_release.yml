name: Package static sites to Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name'     
        required: true
        default: v0.1
      body:
        description: 'Release body'     
        required: true
        default: squoosh-v0.1

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
    - run: npm ci
    - run: |
        npm run build
        zip -r  squoosh.zip build/*
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag_name }}
        name: squoosh-${{ inputs.tag_name }}
        body:  ${{ inputs.body }}
        draft: false
        prerelease: false
        files: |
          squoosh.zip
